<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{og:title}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F0E8">
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  main { min-height: calc(100vh - 80px); display: flex; flex-direction: column; justify-content: center; padding-top: 24px; padding-bottom: 24px; }
  .done { background: #fff; border-radius: 26px; padding: 34px 24px 26px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .pm-gone { width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(26,20,16,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-10deg); color: rgba(26,20,16,0.7); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; line-height: 1.5; }
  .pm-gone b { font-size: 14px; }
  h1 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.05; margin-top: 10px; }
  .done p { color: var(--ink-faded); line-height: 1.45; }
  .done .btn.primary { width: 100%; border-radius: 999px; min-height: 56px; font-size: 17px; margin-top: 10px; }
  main a:not(.btn) { color: var(--pink-deep); font-weight: 700; }
</style>
</head>
<body>
<header class="tnav" data-right="start"></header>
<script type="module" src="/brand.js"></script>
<main class="wrap stack">
  <div class="done">
    <div class="pm-gone" aria-hidden="true"><span>churpie post</span><b>delivered</b><span>★ ★ ★</span></div>
    <h1>{{og:title}}</h1>
    <p>The card may be finished. churpie deletes every reel and message 14 days after it's made, as promised. The copies people saved are theirs to keep.</p>
    <a class="btn primary" href="/new">Start a new card</a>
  </div>
  <p class="ghost" style="text-align: center">Made a card? <a href="/lost">Find it with your email</a>.</p>
</main>
</body>
</html>
