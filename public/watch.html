<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{og:title}}</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="{{og:title}}">
<meta property="og:description" content="{{og:description}}">
<meta property="og:image" content="{{og:image}}">
<meta property="og:url" content="{{og:url}}">
<meta name="theme-color" content="#F5F0E8">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .postcard { background: #fff; border-radius: 10px; padding: 22px 22px 26px; box-shadow: 0 6px 0 var(--paper-aged), 0 12px 0 var(--paper-dark); position: relative; transform: rotate(-1.5deg); margin-top: 28px; }
  .postcard .edge { position: absolute; left: 0; right: 0; top: 0; height: 8px; border-radius: 10px 10px 0 0; background: repeating-linear-gradient(135deg, var(--pink) 0 10px, #fff 10px 20px, var(--cyan) 20px 30px, #fff 30px 40px); }
  .stamp { position: absolute; right: 18px; top: 24px; width: 74px; height: 88px; background: var(--amber-pale); border: 2px dashed var(--amber); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transform: rotate(4deg); }
  .stamp b { font-size: 26px; line-height: 1; } .stamp small { font-size: 10px; font-weight: 700; color: var(--ink-faded); text-align: center; line-height: 1.1; }
  .addr { margin-top: 20px; max-width: 190px; display: flex; flex-direction: column; gap: 4px; }
  .addr .name { font-size: 44px; line-height: 1; }
  .lines { margin-top: 26px; display: flex; flex-direction: column; gap: 8px; } .lines span { height: 2px; background: var(--paper-dark); display: block; }
  @media (prefers-reduced-motion: reduce) { .postcard { transform: none; } }
  .people { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--paper); max-height: 70vh; overflow: auto; }
</style>
</head>
<body>
<div class="stripe"></div>

<!-- ENVELOPE -->
<main class="wrap stack" id="envelope" style="min-height: calc(100vh - 6px); padding-bottom: 24px">
  <div class="topbar"><span></span><a class="logo" href="/">churpie<b>.</b></a></div>
  <div class="postcard">
    <div class="edge"></div>
    <div class="stamp"><b id="stampN">…</b><small>people<br>showed up</small></div>
    <div class="addr"><span class="muted">Made for</span><span class="serif name" id="recName">…</span><span class="muted" id="momentLine"></span></div>
    <div class="lines" aria-hidden="true"><span style="width:100%"></span><span style="width:80%"></span><span style="width:60%"></span></div>
    <p style="margin-top: 22px; font-size: 13px" id="fromLine"></p>
  </div>
  <div class="stack" style="margin-top: 36px; text-align: center; align-items: center">
    <p style="font-size: 17px" id="quietLine">Find a quiet moment.</p>
    <div class="row" style="flex-wrap: wrap; justify-content: center; gap: 8px" id="whatChips"></div>
  </div>
  <div class="stack" style="margin-top: auto; padding-top: 24px">
    <button class="btn primary" id="openBtn">Open it</button>
    <div class="row">
      <button class="btn outline" id="openQuiet">Open without music</button>
      <button class="btn outline" id="laterBtn">Save for later</button>
    </div>
    <p class="ghost" style="text-align: center" id="footLine">You can pause, skip, or come back any time.</p>
  </div>
</main>

<!-- NOT READY / EXPIRED -->
<main class="wrap stack hidden" id="notReady" style="padding-top: 24px"><div class="card stack" id="notReadyBody"></div></main>

<!-- REEL -->
<div class="reel hidden" id="reel"><div class="stage">
  <video id="vid" playsinline preload="auto"></video>
  <div class="top">
    <div class="segs" id="segs" aria-hidden="true"></div>
    <div class="row between"><span class="pill" id="counter">…</span><span class="logo" style="color:#fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3)">churpie<b>.</b></span></div>
  </div>
  <div class="rail">
    <button class="btn" id="loveBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="#D4266A" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>Love it</button>
    <button class="btn" id="pauseBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Pause</button>
    <button class="btn" id="nextBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 5 13 12 5 19 5 5"/><rect x="15" y="5" width="3" height="14" rx="1"/></svg>Next</button>
    <button class="btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="19 5 11 12 19 19 19 5"/><rect x="6" y="5" width="3" height="14" rx="1"/></svg>Back</button>
    <button class="btn" id="muteBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Sound off</button>
  </div>
  <div class="sheet">
    <div class="handle"></div>
    <div class="row">
      <a class="btn primary" id="saveBtn" download="churpie-reel.mp4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>Keep it forever</a>
      <button class="btn" style="width: 58px; padding: 0; flex-direction: column; gap: 2px; font-size: 9px; background: var(--cyan-pale)" id="shareBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8h16v-8"/><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/></svg>Share</button>
      <button class="btn" style="width: 58px; padding: 0; flex-direction: column; gap: 2px; font-size: 9px; background: var(--pink-pale)" id="replyBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>Reply</button>
      <button class="btn" style="width: 58px; padding: 0; flex-direction: column; gap: 2px; font-size: 9px" id="peopleBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19a6 6 0 0 1 12 0"/><path d="M14 19a4 4 0 0 1 7 0"/></svg>Everyone</button>
    </div>
    <p class="ghost" style="text-align: center; margin-top: 10px" id="expiryLine"></p>
    <a class="btn quiet hidden" id="otherSize" href="#" download></a>
  </div>
  <div class="people sheet hidden" id="people"><div class="handle"></div><div class="row between"><h3>Everyone in this reel</h3><button class="btn quiet" style="width:auto" id="peopleClose">Close</button></div><div class="stack" id="peopleList" style="margin-top: 10px"></div></div>
</div></div>

<dialog id="dlg" style="border: 0; border-radius: 24px; padding: 0; width: min(92vw, 420px)"><form class="stack" style="padding: 16px" id="replyForm"><h3>Say thanks to everyone</h3><p class="muted" id="replyNote">Your note goes to everyone who made this.</p><textarea name="text" required maxlength="500" placeholder="You all…"></textarea><button class="btn primary" type="submit">Send</button><button class="btn quiet" type="button" id="dlgClose">Not now</button></form></dialog>

<script type="module">
import { api, $, $$, toast, share, escapeHtml, firstName, fmtDays, reducedMotion } from '/app.js'

const token = location.pathname.split('/')[2]
const data = await api(`/api/watch/${token}`).catch((e) => { $('#envelope').classList.add('hidden'); $('#notReady').classList.remove('hidden'); $('#notReadyBody').innerHTML = `<h2>${escapeHtml(e.message)}</h2>`; throw e })
const { card, people, manifest } = data
const first = firstName(card.recipientName)
const n = people.length
const totalSec = manifest ? Math.round(manifest[manifest.length - 1]?.end || 0) : n * card.clipSeconds
const MOMENT = { birthday: 'for your birthday', congrats: 'to say congratulations', thankyou: 'to say thank you', getwell: 'to say get well soon', missyou: 'because we miss you', memory: 'in memory', team: 'from the team', brand: '' }

$('#stampN').textContent = n
$('#replyNote').textContent = `${firstName(card.hostName)} gets this and can pass it on to everyone.`
$('#recName').textContent = first
$('#momentLine').textContent = MOMENT[card.moment] || ''
$('#fromLine').textContent = `From ${card.hostName}${n > 1 ? ` and ${n - 1} more` : ''}`
$('#quietLine').textContent = `Find a quiet moment. This is about ${Math.max(1, Math.round(totalSec / 60))} ${Math.round(totalSec / 60) === 1 ? 'minute' : 'minutes'} of people who love you.`
$('#whatChips').innerHTML = [`${n} short ${n === 1 ? 'video' : 'videos'}`, 'Music plays', 'Captions on'].map((t) => `<span class="pill">${t}</span>`).join('')
$('#footLine').textContent = card.expiresAt ? `You can pause, skip, or come back any time for ${fmtDays(card.expiresAt)}.` : 'You can pause, skip, or come back any time.'

if (!data.ready) {
  $('#envelope').classList.add('hidden'); $('#notReady').classList.remove('hidden')
  $('#notReadyBody').innerHTML = data.expired
    ? `<h2>This reel isn't here anymore.</h2><p class="muted">${escapeHtml(card.hostName)}${n > 1 ? ` and ${n - 1} others` : ''} made it for ${escapeHtml(first)}. We delete every reel after 30 days, as promised, so the copies that remain are the ones people saved.</p>`
    : `<h2>${escapeHtml(card.hostName)} is still putting this together.</h2><p class="muted">It's almost ready. Come back a little later.</p>`
}

// ── reel ─────────────────────────────────────────────────────────────────────
const vid = $('#vid')
let withMusic = true, idx = 0
const segsCap = Math.min(20, manifest?.length || n)
$('#segs').innerHTML = Array.from({ length: segsCap }, () => '<span></span>').join('')
$('#expiryLine').textContent = card.expiresAt ? `Saves to your phone. This link stays open ${fmtDays(card.expiresAt)}.` : 'Saves to your phone.'
$('#peopleList').innerHTML = people.map((p, i) => `<button class="btn" style="justify-content: space-between" data-i="${i}"><span>${escapeHtml(p.name)}${p.location ? ` <span class="muted">· ${escapeHtml(p.location)}</span>` : ''}</span><span class="muted">${p.kind === 'text' ? 'wrote' : 'video'}</span></button>`).join('')

// wide screens get the wide export (reel in the middle, postcard panels either side); phones get the vertical one
const useWide = () => !!data.reelWideUrl && window.innerWidth > window.innerHeight && window.innerWidth >= 700
function pickSource() {
  const wide = useWide()
  $('.stage').classList.toggle('wide', wide)
  const src = wide ? data.reelWideUrl : data.reelUrl
  if (vid.getAttribute('src') !== src) { const t = vid.currentTime, playing = !vid.paused; vid.src = src; vid.currentTime = t; if (playing) vid.play().catch(() => {}) }
  $('#saveBtn').href = src
  $('#saveBtn').download = wide ? `churpie-${first.toLowerCase()}-wide.mp4` : `churpie-${first.toLowerCase()}.mp4`
  $('#otherSize').classList.toggle('hidden', !data.reelWideUrl)
  $('#otherSize').textContent = wide ? 'Phone-shaped version' : 'Wide version for laptops and TVs'
  $('#otherSize').href = wide ? data.reelUrl : data.reelWideUrl
}
window.addEventListener('resize', () => { if (!$('#reel').classList.contains('hidden')) pickSource() })
function open(music) {
  withMusic = music
  $('#envelope').classList.add('hidden'); $('#reel').classList.remove('hidden')
  pickSource()
  vid.muted = false
  if (!music) toast('Playing without music. Voices stay on.')
  vid.play().catch(() => {})
}
$('#openBtn').onclick = () => open(true)
$('#openQuiet').onclick = () => open(false)
$('#laterBtn').onclick = async () => { await share({ title: `${first}, people made you something`, text: 'Your churpie reel. Open it when you have a quiet moment.', url: location.href }); }

function segmentAt(t) {
  if (!manifest) return 0
  const i = manifest.findIndex((m) => t >= m.start && t < m.end)
  return i < 0 ? manifest.length - 1 : i
}
vid.addEventListener('timeupdate', () => {
  if (!manifest) return
  const i = segmentAt(vid.currentTime); const m = manifest[i]
  if (i !== idx || !$('#counter').dataset.set) {
    $('#counter').dataset.set = '1'
    idx = i
    $('#counter').textContent = `Message ${i + 1} of ${manifest.length}`
    $$('#segs span').forEach((s, k) => { const seg = Math.floor(k * manifest.length / segsCap); s.className = seg < i ? 'done' : seg === i ? 'now' : '' })
  }
  const p = Math.round(((vid.currentTime - m.start) / Math.max(0.1, m.end - m.start)) * 100)
  $$('#segs span.now').forEach((s) => s.style.setProperty('--p', `${p}%`))
})
// The music is mixed into the reel; "without music" lowers the whole track slightly and voices still carry. Full separation comes with a second audio track later.
vid.addEventListener('play', () => { vid.volume = withMusic ? 1 : 0.85 })
$('#pauseBtn').onclick = () => { if (vid.paused) { vid.play(); $('#pauseBtn').lastChild.textContent = 'Pause' } else { vid.pause(); $('#pauseBtn').lastChild.textContent = 'Play' } }
$('#nextBtn').onclick = () => { if (manifest) vid.currentTime = manifest[Math.min(manifest.length - 1, idx + 1)].start + 0.05 }
$('#backBtn').onclick = () => { if (manifest) vid.currentTime = manifest[Math.max(0, idx - 1)].start + 0.05 }
$('#muteBtn').onclick = () => { vid.muted = !vid.muted; $('#muteBtn').lastChild.textContent = vid.muted ? 'Sound on' : 'Sound off' }
$('#loveBtn').onclick = () => { const m = manifest?.[idx]; if (m) api(`/api/watch/${token}/event`, { method: 'POST', body: { type: 'loved', clipId: m.clipId } }); toast(`${m?.name || 'They'} will know you loved it.`) }
$('#saveBtn').onclick = () => { api(`/api/watch/${token}/event`, { method: 'POST', body: { type: 'saved' } }); toast('Saving to your phone.') }
$('#shareBtn').onclick = () => share({ title: `${first}'s reel`, text: `${n} people made this for ${first}.`, url: location.href })
$('#peopleBtn').onclick = () => $('#people').classList.remove('hidden')
$('#peopleClose').onclick = () => $('#people').classList.add('hidden')
$('#peopleList').onclick = (e) => { const b = e.target.closest('[data-i]'); if (!b || !manifest) return; const m = manifest.find((x) => x.clipId === people[b.dataset.i].id); if (m) vid.currentTime = m.start + 0.05; $('#people').classList.add('hidden'); vid.play() }
$('#replyBtn').onclick = () => $('#dlg').showModal()
$('#dlgClose').onclick = () => $('#dlg').close()
$('#replyForm').addEventListener('submit', async (e) => { e.preventDefault(); await api(`/api/watch/${token}/reply`, { method: 'POST', body: { text: new FormData(e.target).get('text') } }); $('#dlg').close(); toast("It's on its way.") })
// tap right side of the video to skip, left to go back: a bonus, never the only way
vid.addEventListener('click', (e) => { const r = vid.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width; if (x > 0.7) $('#nextBtn').click(); else if (x < 0.3) $('#backBtn').click(); else $('#pauseBtn').click() })
vid.addEventListener('ended', () => { toast(`That's everyone. ${n} ${n === 1 ? 'person' : 'people'} showed up for you. Tap Keep it forever to save it.`, 6000) })
</script>
</body>
</html>
